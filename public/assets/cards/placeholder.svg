  </defs>
  
  <!-- Card background -->
  <rect x="2" y="2" width="196" height="276" rx="10" fill="url(#cardBg)" stroke="url(#goldBorder)" stroke-width="2"/>
  
  <!-- Inner border -->
  <rect x="8" y="8" width="184" height="264" rx="7" fill="none" stroke="#d4a853" stroke-width="0.5" opacity="0.3"/>
  
