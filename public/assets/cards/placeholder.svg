  <circle cx="100" cy="120" r="35" fill="none" stroke="#d4a853" stroke-width="0.5" opacity="0.3"/>
  
  <!-- Star decoration center -->
  <path d="M100 95 L104 108 L118 105 L107 114 L118 123 L104 120 L100 133 L96 120 L82 123 L93 114 L82 105 L96 108 Z" fill="#d4a853" opacity="0.5"/>
  
